name: Set up Eta build environment
description: Installs JDK, Gradle, and Android SDK, shared by PR Check and Eta Build

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: "25"

    # setup-gradle performs Gradle Wrapper verification by default, so no separate verification step is needed
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        cache-provider: basic

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      with:
        packages: ""
        log-accepted-android-sdk-licenses: false

    - name: Install Android SDK 37.2
      shell: bash
      run: sdkmanager --channel=3 "platforms;android-37.2"
