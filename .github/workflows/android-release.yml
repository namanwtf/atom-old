name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs in parallel with packaging and never touches signing Secrets; failure doesn't block APK upload, but does block the release draft
  verify:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Lint and unit tests
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Restore release keystore
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Missing Release signing Secrets; please check the repository's Actions Secrets."
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: Build Debug and Release APKs
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        # Release tags keep a clean version name; other builds append +<short commit hash> to distinguish from published versions
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            :app:assembleDebug :app:assembleRelease

      - name: Verify and collect APKs
        id: apk
        run: |
          # Filenames are generated by Gradle from versionName, e.g. Eta-vX.Y.Z.apk, Eta-vX.Y.Z-debug+<sha>.apk
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Unexpected Debug APK count (${#debug_apks[@]})."
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Unexpected Release APK count (${#release_apks[@]})."
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          # Release tag must match versionName to avoid tag/package version mismatch
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="$(jq -r '.elements[0].versionName' \
              app/build/outputs/apk/release/output-metadata.json)"
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name."
              exit 1
            fi
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  # The build job holds signing Secrets; write-release permission is isolated here and only runs on release tags
  draft-release:
    name: Create release draft
    needs: [verify, build-apks]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Uncompressed uploaded artifacts are named by filename. The filename is not passed through job outputs:
      # Any output value containing a substring of a Secret is dropped entirely by Actions, causing the download step to fall back to downloading all artifacts.
      # The tag is already validated as v<versionName> in the build job, and the Gradle artifact is named Eta-v<versionName>.apk, so it can be derived directly from the tag.
      - name: Download Release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Eta-${{ github.ref_name }}.apk
          path: ${{ runner.temp }}/release

      # Only create a draft: drafts don't appear in releases/latest, so in-app update checks won't see it until a maintainer publishes it
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/release/Eta-${{ github.ref_name }}.apk
        run: >-
          gh release create "$GITHUB_REF_NAME" "$APK_PATH"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
