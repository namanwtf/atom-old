name: sync-upstream

# Keeps the fork rebased on Mangi-11/Eta so upstream fixes are never missed.
# Clean rebase -> push branch + open PR. Conflicts -> open an issue with the file list.

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "eta-en bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Mangi-11/Eta.git || true
          git fetch upstream main
          echo "UPSTREAM_SHA=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git merge-base HEAD upstream/main | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Rebase onto upstream
        id: rebase
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rebase upstream/main > /tmp/rebase.log 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            grep -E '^(CONFLICT|error:)' /tmp/rebase.log | head -40 > /tmp/conflicts.txt || true
            git rebase --abort || true
            {
              printf 'Rebase onto `%s` hit conflicts.\n\nResolve locally:\n\n```\ngit fetch upstream && git rebase upstream/main\n```\n\nConflict log:\n\n```\n' "$UPSTREAM_SHA"
              cat /tmp/conflicts.txt
              printf '\n```\n'
            } > /tmp/issue.md
          fi

      - name: Push synced branch
        if: steps.rebase.outputs.status == 'clean'
        run: |
          BRANCH="sync/upstream-${UPSTREAM_SHA}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open pull request
        if: steps.rebase.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore: rebase onto upstream ${UPSTREAM_SHA}" \
            --body "Automated upstream sync. Base \`${BASE_SHA}\` -> \`${UPSTREAM_SHA}\`. Review the diff and confirm the English/privacy/bubble patches still apply cleanly." \
            --base main --head "$BRANCH" \
            || gh pr list --head "$BRANCH" --json url -q '.[0].url'

      - name: Open conflict issue
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "upstream sync conflict: ${UPSTREAM_SHA}" \
            --body-file /tmp/issue.md
