name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Project targets a Java 25 toolchain (see app/build.gradle.kts).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Show installed platforms
        run: sdkmanager --list_installed | sed -n '1,40p'

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # secrets are not allowed in `if:` expressions, so the presence check happens in shell.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret configured; skipping signing."
            exit 0
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APK=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          [ -z "$APK" ] && APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "$RUNNER_TEMP/unsigned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "atom-${GITHUB_RUN_NUMBER}.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            atom-*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 'atom-*.apk'
          fail_on_unmatched_files: false
          generate_release_notes: true
